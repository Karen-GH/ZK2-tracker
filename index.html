<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen Koi 2 Collection Tracker</title>
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Houd je Zen Koi 2 verzameling bij en synchroniseer met Google Drive.">
  <link rel="manifest" href="./manifest.json">
  <!-- SheetJS voor Excel import -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- html2canvas voor het exporteren van patronen als afbeelding -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      /* Standaard (Dark Mode) */
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent-koi: #e67e22;
      --accent-dragon: #9b59b6;
      --accent-blue: #58a6ff;
      --success: #2ea043;
      --cell-bg: #0d1117;
    }

    body.light-mode {
      /* Light Mode Kleuren */
      --bg: #f6f8fa;
      --card-bg: #ffffff;
      --border: #d0d7de;
      --text: #24292f;
      --text-muted: #57606a;
      --accent-blue: #0969da;
      --cell-bg: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 15px; position: sticky; top: 0; z-index: 100; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h1 { font-size: 1.2rem; color: var(--text); }
    .controls { display: flex; flex-direction: column; gap: 10px; }
    .search-sort-row { display: flex; gap: 8px; align-items: center; }
    input[type="search"] { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; width: 100%; font-size: 0.9rem; flex: 1; }
    select.sort-select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    .sort-dir-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; min-width: 40px; }

    .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
    
    .progress-bar-container { background: var(--bg); border-radius: 6px; height: 12px; overflow: hidden; margin-top: 8px; display: flex; }
    .bar-koi { background: var(--accent-koi); height: 100%; transition: width 0.3s; }
    .bar-dragon { background: var(--accent-dragon); height: 100%; transition: width 0.3s; }
    .stats-summary { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 4px; }

    main { padding: 15px; }
    .pattern-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .pattern-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; transition: transform 0.1s, border-color 0.2s; display: flex; flex-direction: column; justify-content: space-between; height: 80px; }
    .pattern-title { font-weight: bold; font-size: 0.95rem; color: var(--text); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; white-space: nowrap; overflow: hidden; }
    .pattern-title span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .pattern-card:active { transform: scale(0.98); }
    .pattern-stats { font-size: 0.75rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 3px; }
    .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: normal; }
    .badge-zero { background: #ff2121; }
    .badge-koi { background: var(--accent-koi); }
    .badge-dragon { background: var(--accent-dragon); }
    .badge-progress { background: #5c81f8; }

    /* Modal / Detail View */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; overflow-y: auto; }
    .modal-content { background: var(--card-bg); margin: 20px auto; width: 92%; max-width: 500px; border-radius: 12px; border: 1px solid var(--border); padding: 16px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

    .grid-section-title { font-size: 0.9rem; color: var(--accent-blue); margin: 12px 0 6px 0; text-transform: uppercase; letter-spacing: 0.5px; }
    .koi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 15px; }
    .grid-cell { height: 45px; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.6rem; text-align: center; cursor: pointer; user-select: none; padding: 2px; background: var(--cell-bg); color: var(--text-muted); overflow: hidden; }
    .grid-cell.koi { background: rgba(230, 126, 34, 0.2); border-color: var(--accent-koi); color: var(--accent-koi); font-weight: bold; }
    .grid-cell.dragon { background: rgba(155, 89, 182, 0.25); border-color: var(--accent-dragon); color: var(--accent-dragon); font-weight: bold; }

    /* Bottom Navigation */
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; }
    .nav-item { color: var(--text-muted); text-decoration: none; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; border: none; background: none; }
    .nav-item.active { color: var(--accent-blue); }

    .btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; width: 100%; margin-top: 8px; }
    .btn-primary { background: #238636; color: #fff; border-color: #2ea043; }
    .btn-danger { background: #da3633; color: #fff; border-color: #f85149; }

    .hint { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
    .drive-url-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; width: 100%; font-size: 0.85rem; margin-bottom: 8px; }
    .status { font-size: 0.8rem; margin-top: 10px; line-height: 1.4; }
    .status.ok { color: #56d364; } .status.err { color: #f85149; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Zen Koi 2 Collection Tracker</h1>
      <button class="icon-btn" onclick="toggleTheme()" title="Wissel Light/Dark mode" style="background:none; border:none; cursor:pointer; font-size:1.2rem;">🌓</button>
      <span id="total-percent" style="font-size: 0.9rem; font-weight: bold; color: var(--accent-blue);">0%</span>
    </div>
    <div class="controls">
      <div class="search-sort-row">
        <input type="search" id="search-input" placeholder="Zoek patroonnaam..." oninput="renderPatterns()">
        <select id="sort-select" class="sort-select" onchange="renderPatterns()">
          <option value="name">Alfabetisch</option>
          <option value="progress">Voortgang</option>
        </select>
        <button id="sort-dir-btn" class="sort-dir-btn" onclick="toggleSortDirection()" title="Wissel oplopend/aflopend">⬆️</button>
      </div>
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setFilter('all', this)">Alles</button>
        <button class="tab-btn" onclick="setFilter('collectors', this)">Collectors</button>
        <button class="tab-btn" onclick="setFilter('progressives', this)">Progressives</button>
        <button class="tab-btn" onclick="setFilter('todo', this)">Onvoltooid</button>
        <button class="tab-btn" onclick="setFilter('done', this)">Voltooid</button>
      </div>
    </div>
    <div class="progress-bar-container">
      <div id="bar-koi" class="bar-koi" style="width: 0%"></div>
      <div id="bar-dragon" class="bar-dragon" style="width: 0%"></div>
    </div>
    <div class="stats-summary">
      <span id="stats-koi">Koi: 0 / -</span>
      <span id="stats-dragon">Dragons: 0 / -</span>
    </div>
  </header>

  <main>
    <div id="pattern-container" class="pattern-grid"></div>
  </main>

  <!-- Detail Modal -->
  <div id="detail-modal" class="modal">
    <div class="modal-content" id="modal-export-content">
      <div class="modal-header">
        <h2 id="modal-pattern-title">Patroon</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="grid-section-title">Common</div>
      <div id="common-grid" class="koi-grid"></div>
      <div class="grid-section-title">Rare</div>
      <div id="rare-grid" class="koi-grid"></div>
    </div>
  </div>

  <!-- Instellingen Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Gegevensbeheer</h2>
        <button class="close-btn" onclick="closeSettings()">&times;</button>
      </div>

      <div class="grid-section-title" style="margin-top:0">Voortgang Synchronisatie</div>
      <p class="hint">Plak de link van je eigen Google Sheet om handmatig je voortgang op te halen (met behoud van d > k prioriteit).</p>
      <input type="url" id="drive-url" class="drive-url-input" placeholder="https://docs.google.com/spreadsheets/d/…" onchange="saveDriveUrl()">

      <button id="btn-sync-from" class="btn btn-primary" onclick="syncFromDrive(false)">📥 Sync voortgang vanaf Google</button>
      <div id="sync-status" class="status"></div>

      <hr style="border-color: var(--border); margin: 15px 0;">
      <div class="grid-section-title" style="margin-top:0">Bestand / back-up</div>
      <input type="file" id="json-file-input" accept=".json" style="display: none;" onchange="handleFileImport(event)">
      <button class="btn" onclick="document.getElementById('json-file-input').click()">📥 Importeer JSON Back-up</button>
      <button class="btn" onclick="exportJSON()">📤 Download JSON Back-up</button>
      <hr style="border-color: var(--border); margin: 15px 0;">
      <button class="btn btn-danger" onclick="resetAllData()">🗑️ Reset Alle Voortgang</button>
    </div>
  </div>

  <nav>
    <button class="nav-item active" onclick="showHome()"><span style="font-size: 1.2rem;">🐟</span>Collectie</button>
    <button class="nav-item" onclick="openSettings()"><span style="font-size: 1.2rem;">⚙️</span>Instellingen</button>
  </nav>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      localStorage.setItem('zk2_theme', isLight ? 'light' : 'dark');
    }

    const LS_PROGRESS = 'zk2_user_progress', LS_PATTERNS = 'zk2_patterns', LS_SETTINGS = 'zk2_settings';
    const DEFAULT_SHEETS = ['A-M: Collectors', 'N-Z: Collectors'];
    const HARDCODED_PATTERN_URL = "https://docs.google.com/spreadsheets/d/1akuOUpPjwNLIFaTO7IxMNiGyv8hApBzzSYnB2V8BgxQ/edit?gid=0#gid=0";

    let sortDirection = 'asc'; // 'asc' of 'desc'

    function toggleSortDirection() {
      sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      document.getElementById('sort-dir-btn').innerText = sortDirection === 'asc' ? '⬆️' : '⬇️';
      renderPatterns();
    }

    // --- PARSERS ---
    function cellStr(v) { return String(v == null ? '' : v).trim(); }

    function parseGrid(rows, validNamesSet, sheetName, importProgress) {
      const out = [];
      for (let r = 0; r < rows.length; r++) {
        const row = rows[r] || [];
        const rowText = row.map(cellStr).join(' ').toLowerCase();
        if (rowText.includes('koi names') || rowText.includes('waiting in inbox')) continue;

        for (let c = 0; c < row.length; c++) {
          const name = cellStr(row[c]);
          if (!name || /koi\s*names/i.test(name) || name.includes(':')) continue;

          if (validNamesSet && validNamesSet.size > 0) {
            const matchFound = Array.from(validNamesSet).some(vn => vn.trim().toLowerCase() === name.trim().toLowerCase());
            if (!matchFound) continue;
          } else {
            if (/^\d+$/.test(name) || /^(koi|dragons?|common|rare|-|waiting)/i.test(name) || name.length < 2) continue;
          }

          let headRowIdx = -1, cStartCol = -1;
          for (let scanR = r; scanR <= r + 2 && scanR < rows.length; scanR++) {
            const sRow = rows[scanR] || [];
            for (let col = 0; col < sRow.length; col++) {
              if (cellStr(sRow[col]).startsWith('-')) { headRowIdx = scanR; cStartCol = col; break; }
            }
            if (headRowIdx !== -1) break;
          }

          if (headRowIdx === -1 || cStartCol === -1) continue;
          const head = rows[headRowIdx] || [];

          const cCols = [];
          for (let k = cStartCol; k < cStartCol + 4 && k < head.length; k++) {
            if (cellStr(head[k]) !== '' && !cellStr(head[k]).toLowerCase().includes('dragon')) cCols.push(k);
          }

          let rareStart = -1;
          for (let k = cStartCol + 4; k < head.length; k++) {
            if (cellStr(head[k]).startsWith('-')) { rareStart = k; break; }
          }
          if (rareStart === -1) rareStart = cStartCol + 5;

          const rCols = [];
          for (let k = rareStart; k < rareStart + 4 && k < head.length; k++) {
            const h = cellStr(head[k]);
            if (h !== '' && !h.toLowerCase().includes('dragon') && h.toLowerCase() !== 'koi') rCols.push(k);
          }

          if (!cCols.length) continue;

          const pref = [], rowIdx = [];
          for (let i = headRowIdx + 1; i < rows.length && pref.length < 10; i++) {
            const pRow = rows[i] || [];
            let label = '';
            for (let pc = 0; pc <= c + 1; pc++) {
              if (cellStr(pRow[pc]).endsWith('-')) { label = cellStr(pRow[pc]); break; }
            }
            if (label && label.endsWith('-')) {
              pref.push(label.replace(/-$/, '').trim());
              rowIdx.push(i);
            } else { break; }
          }

          if (!pref.length) continue;

          const cells = {};
          if (importProgress) {
            rowIdx.forEach((ri, i) => {
              cCols.forEach((col, j) => {
                const v = cellStr((rows[ri] || [])[col]).toLowerCase();
                if (v === 'k' || v === 'd') cells[`c_${i}_${j}`] = v;
              });
              rCols.forEach((col, j) => {
                const v = cellStr((rows[ri] || [])[col]).toLowerCase();
                if (v === 'k' || v === 'd') cells[`r_${i}_${j}`] = v;
              });
            });
          }

          if (!out.some(p => p.name.toLowerCase() === name.toLowerCase())) {
            out.push({
              name, type: 'collector', sheetName: sheetName || 'Collectors', pref,
              c_suf: cCols.map(k => cellStr(head[k]).replace(/^-/, '').trim()),
              r_suf: rCols.map(k => cellStr(head[k]).replace(/^-/, '').trim()),
              cells
            });
          }
        }
      }
      return out;
    }

    function parseProgressivesGrid(rows, sheetName = 'Progressives', importProgress) {
      const out = [];
      const validPatternNames = new Set();
      for (let r = 1; r <= 31 && r < rows.length; r++) {
        const nameVal = cellStr((rows[r] || [])[0]).trim();
        if (nameVal && nameVal.length >= 2 && !nameVal.endsWith('-') && !/^ku-/i.test(nameVal)) {
          validPatternNames.add(nameVal.toLowerCase());
        }
      }

      const startCols = [8, 19, 30];
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r] || [];
        startCols.forEach(startCol => {
          for (let c = startCol; c < startCol + 3 && c < row.length; c++) {
            const name = cellStr(row[c]).trim();
            if (!name || name.length < 2 || /^\d+$/.test(name) || /^(koi|dragon|common|rare|-)/i.test(name)) continue;
            if (name.endsWith('-') || /^ku-/i.test(name)) continue;
            if (validPatternNames.size > 0 && !validPatternNames.has(name.toLowerCase())) continue;

            let headRowIdx = -1, cStartCol = -1;
            for (let scanR = r; scanR <= r + 2 && scanR < rows.length; scanR++) {
              const sRow = rows[scanR] || [];
              for (let col = c - 1; col <= c + 3 && col < sRow.length; col++) {
                if (cellStr(sRow[col]).startsWith('-')) { headRowIdx = scanR; cStartCol = col; break; }
              }
              if (headRowIdx !== -1) break;
            }

            if (headRowIdx === -1 || cStartCol === -1) continue;
            const head = rows[headRowIdx] || [];

            const cCols = [];
            for (let k = cStartCol; k < cStartCol + 4 && k < head.length; k++) {
              if (cellStr(head[k]) !== '' && !cellStr(head[k]).toLowerCase().includes('dragon')) cCols.push(k);
            }

            let rareStart = -1;
            for (let k = cStartCol + 4; k < head.length; k++) {
              if (cellStr(head[k]).startsWith('-')) { rareStart = k; break; }
            }
            if (rareStart === -1) rareStart = cStartCol + 5;

            const rCols = [];
            for (let k = rareStart; k < rareStart + 4 && k < head.length; k++) {
              const h = cellStr(head[k]);
              if (h !== '' && !h.toLowerCase().includes('dragon') && h.toLowerCase() !== 'koi') rCols.push(k);
            }

            if (!cCols.length) continue;

            const pref = [], rowIdx = [];
            for (let i = headRowIdx + 1; i < rows.length && pref.length < 10; i++) {
              const pRow = rows[i] || [];
              let label = '';
              for (let pc = 0; pc <= cStartCol + 1; pc++) {
                if (cellStr(pRow[pc]).endsWith('-')) { label = cellStr(pRow[pc]); break; }
              }
              if (label && label.endsWith('-')) {
                pref.push(label.replace(/-$/, '').trim());
                rowIdx.push(i);
              } else { break; }
            }

            if (!pref.length) continue;

            const cells = {};
            if (importProgress) {
              rowIdx.forEach((ri, i) => {
                cCols.forEach((col, j) => {
                  const v = cellStr((rows[ri] || [])[col]).toLowerCase();
                  if (v === 'k' || v === 'd') cells[`c_${i}_${j}`] = v;
                });
                rCols.forEach((col, j) => {
                  const v = cellStr((rows[ri] || [])[col]).toLowerCase();
                  if (v === 'k' || v === 'd') cells[`r_${i}_${j}`] = v;
                });
              });
            }

            if (!out.some(p => p.name.toLowerCase() === name.toLowerCase())) {
              out.push({
                name, type: 'progressive', sheetName: sheetName, pref,
                c_suf: cCols.map(k => cellStr(head[k]).replace(/^-/, '').trim()),
                r_suf: rCols.map(k => cellStr(head[k]).replace(/^-/, '').trim()),
                cells
              });
            }
          }
        });
      }
      return out;
    }

    let userProgress = {}, customPatterns = {}, settings = {}, patterns = [];
    let currentFilter = 'all', activePattern = null;

    function loadJSON(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
    }
    function rebuildPatterns() {
      const map = {};
      Object.values(customPatterns).forEach(p => map[p.name] = p);
      patterns = Object.values(map);
    }
    function saveUserProgress() { localStorage.setItem(LS_PROGRESS, JSON.stringify(userProgress)); updateGlobalStats(); }
    function saveCustomPatterns() { localStorage.setItem(LS_PATTERNS, JSON.stringify(customPatterns)); rebuildPatterns(); }
    function saveSettings() { localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); }

    function slotsOf(p) { return p.pref.length * (p.c_suf.length + p.r_suf.length); }
    function countOf(p) {
      let n = 0;
      for (let r = 0; r < p.pref.length; r++) {
        for (let c = 0; c < p.c_suf.length; c++) if (userProgress[`${p.name}_c_${r}_${c}`]) n++;
        for (let c = 0; c < p.r_suf.length; c++) if (userProgress[`${p.name}_r_${r}_${c}`]) n++;
      }
      return n;
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPatterns();
    }

    function dragonCountOf(p) {
      let d = 0;
      for (let r = 0; r < p.pref.length; r++) {
        for (let c = 0; c < p.c_suf.length; c++) if (userProgress[`${p.name}_c_${r}_${c}`] === 'd') d++;
        for (let c = 0; c < p.r_suf.length; c++) if (userProgress[`${p.name}_r_${r}_${c}`] === 'd') d++;
      }
      return d;
    }

    function renderPatterns() {
      const container = document.getElementById('pattern-container');
      const search = document.getElementById('search-input').value.toLowerCase();
      const sortType = document.getElementById('sort-select').value;
      container.innerHTML = '';

      // Filter de patronen
      let filtered = patterns.filter(p => {
        if (!p.name.toLowerCase().includes(search)) return false;
        const got = countOf(p);
        const total = slotsOf(p);

        if (currentFilter === 'collectors' && p.type === 'progressive') return false;
        if (currentFilter === 'progressives' && p.type !== 'progressive') return false;
        if (currentFilter === 'todo' && got >= total) return false;
        if (currentFilter === 'done' && got < total) return false;
        return true;
      });

      // Sorteer op basis van Alfabetisch of Voortgang + richting (asc/desc)
      filtered.sort((a, b) => {
        let res = 0;
        if (sortType === 'name') {
          res = a.name.localeCompare(b.name);
        } else if (sortType === 'progress') {
          const pctA = slotsOf(a) > 0 ? (countOf(a) / slotsOf(a)) : 0;
          const pctB = slotsOf(b) > 0 ? (countOf(b) / slotsOf(b)) : 0;
          res = pctA - pctB;
          if (res === 0) res = a.name.localeCompare(b.name);
        }
        return sortDirection === 'asc' ? res : -res;
      });

      filtered.forEach(p => {
        const got = countOf(p);
        const dragons = dragonCountOf(p);
        const total = slotsOf(p);

        const pct = total > 0 ? Math.round((got / total) * 100) : 0;
        let badgeClass = pct === 100 ? ((dragons === total) ? 'badge-dragon' : 'badge-koi') : (pct === 0 ? 'badge-zero' : 'badge-progress');
        const badgeHtml = total > 0 ? `<span class="badge ${badgeClass}">${pct}%</span>` : '';

        const card = document.createElement('div');
        card.className = 'pattern-card';
        card.onclick = () => openPatternDetail(p);
        card.innerHTML = `
          <div class="pattern-title"><span>${p.name}</span>${badgeHtml}</div>
          <div class="pattern-stats"><span>Voortgang: ${got} / ${total}</span></div>`;
        container.appendChild(card);
      });
      updateGlobalStats();
    }

    function openPatternDetail(p) {
      activePattern = p;
      document.getElementById('modal-pattern-title').innerHTML = `
        <span>${p.name}</span>
        <button onclick="deletePattern('${p.name.replace(/'/g, "\\'")}')" style="border:none; border-radius:4px; padding:4px 8px; font-size:0.75rem; margin-left:10px; cursor:pointer;">🗑️</button>
        <button onclick="downloadPatternImage()" style="border:none; border-radius:4px; padding:4px 8px; font-size:0.75rem; margin-left:10px; cursor:pointer;">⬇️</button>
      `;
      renderGrid('common-grid', p, 'c');
      renderGrid('rare-grid', p, 'r');
      document.getElementById('detail-modal').style.display = 'block';
    }

    function deletePattern(name) {
      if (confirm(`Weet je zeker dat je het patroon "${name}" wilt verwijderen?`)) {
        delete customPatterns[name];
        Object.keys(userProgress).forEach(k => { if (k.startsWith(name + '_')) delete userProgress[k]; });
        saveCustomPatterns(); saveUserProgress(); closeModal(); renderPatterns();
      }
    }

    function downloadPatternImage() {
      const element = document.getElementById('modal-export-content');
      const closeBtn = element.querySelector('.close-btn');
      if (closeBtn) closeBtn.style.display = 'none';

      html2canvas(element, { backgroundColor: '#161b22', scale: 2 }).then(canvas => {
        if (closeBtn) closeBtn.style.display = 'block';
        const link = document.createElement('a');
        link.download = `ZK2_${activePattern ? activePattern.name : 'patroon'}_voortgang.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        if (closeBtn) closeBtn.style.display = 'block';
        alert('Kon geen afbeelding maken: ' + err.message);
      });
    }

    function renderGrid(containerId, p, type) {
      const gridEl = document.getElementById(containerId);
      const suffixes = type === 'c' ? p.c_suf : p.r_suf;
      gridEl.innerHTML = '';
      gridEl.style.gridTemplateColumns = `repeat(${suffixes.length || 4}, 1fr)`;
      for (let r = 0; r < p.pref.length; r++) {
        for (let c = 0; c < suffixes.length; c++) {
          const key = `${p.name}_${type}_${r}_${c}`;
          const val = userProgress[key] || '';
          const cell = document.createElement('div');
          cell.className = `grid-cell ${val === 'k' ? 'koi' : val === 'd' ? 'dragon' : ''}`;
          cell.innerHTML = `
            <div style="font-weight:600; font-size:0.6rem; word-break:break-word;">${p.pref[r]}${suffixes[c]} ${p.name}</div>
            <div style="font-size:0.75rem; margin-top:2px;">${val === 'k' ? 'Koi' : val === 'd' ? 'Dragon' : ''}</div>`;
          cell.onclick = () => toggleCellStatus(key, cell);
          gridEl.appendChild(cell);
        }
      }
    }

    function toggleCellStatus(key, cellEl) {
      const cur = userProgress[key] || '';
      const next = cur === '' ? 'k' : cur === 'k' ? 'd' : '';
      if (next) userProgress[key] = next; else delete userProgress[key];
      saveUserProgress();
      cellEl.className = `grid-cell ${next === 'k' ? 'koi' : next === 'd' ? 'dragon' : ''}`;
      cellEl.querySelector('div:nth-child(2)').innerText = next === 'k' ? 'Koi' : next === 'd' ? 'Dragon' : '';
      renderPatterns();
    }

    function updateGlobalStats() {
      let koi = 0, dragon = 0, maxKoi = 0;
      patterns.forEach(p => maxKoi += p.pref.length * (p.c_suf.length + p.r_suf.length));
      Object.values(userProgress).forEach(v => { if (v === 'k' || v === 'd') koi++; if (v === 'd') dragon++; });
      const max = Math.max(maxKoi, 1);
      document.getElementById('total-percent').innerText = `${Math.round(((koi + dragon) / (max * 2)) * 100)}%`;
      document.getElementById('stats-koi').innerText = `Koi: ${koi} / ${max}`;
      document.getElementById('stats-dragon').innerText = `Dragons: ${dragon} / ${max}`;
      document.getElementById('bar-koi').style.width = `${(koi / (max * 2)) * 100}%`;
      document.getElementById('bar-dragon').style.width = `${(dragon / (max * 2)) * 100}%`;
    }

    function applyParsed(parsed, importProgress) {
      const sheetNames = new Set(parsed.map(p => p.name));
      parsed.forEach(p => {
        customPatterns[p.name] = {
          name: p.name,
          type: p.type || 'collector',
          sheetName: p.sheetName,
          c_suf: p.c_suf,
          r_suf: p.r_suf,
          pref: p.pref
        };

        if (importProgress && p.cells) {
          [['c', p.c_suf.length], ['r', p.r_suf.length]].forEach(([t, w]) => {
            for (let r = 0; r < p.pref.length; r++) {
              for (let c = 0; c < w; c++) {
                const k = `${t}_${r}_${c}`;
                const key = `${p.name}_${k}`;
                const sheetVal = p.cells[k];

                if (sheetVal === 'k' || sheetVal === 'd') {
                  const localVal = userProgress[key] || '';
                  if (localVal === 'd') {
                    continue;
                  } else {
                    userProgress[key] = sheetVal;
                  }
                  if (!userProgress[key]) delete userProgress[key];
                }
              }
            }
          });
        }
      });

      saveCustomPatterns();
      if (importProgress) saveUserProgress();
      renderPatterns();
      return sheetNames.size;
    }

    function showStatus(msg, kind) {
      const el = document.getElementById('sync-status');
      if (el) {
        el.className = 'status ' + (kind || '');
        el.innerHTML = msg;
      }
    }

    function sheetId(url) { const m = String(url || '').match(/\/d\/([a-zA-Z0-9_-]{15,})/); return m ? m[1] : null; }

    function fetchSheetJSONP(id, sheetName) {
      return new Promise((resolve, reject) => {
        const cbName = 'zk2Cb_' + Math.random().toString(36).slice(2);
        const script = document.createElement('script');
        const timer = setTimeout(() => { cleanup(); reject(new Error('Time-out bij ophalen van ' + (sheetName || 'sheet'))); }, 10000);
        function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }

        window[cbName] = (res) => {
          cleanup();
          if (!res || res.status === 'error' || !res.table) { reject(new Error('Kan sheet niet lezen')); return; }
          const rows = [];
          const cols = res.table.cols || [];
          if (cols.some(c => c && c.label)) rows.push(cols.map(c => (c && c.label) ? c.label : ''));
          (res.table.rows || []).forEach(r => {
            rows.push((r.c || []).map(cell => cell ? (cell.v != null ? cell.v : (cell.f || '')) : ''));
          });
          resolve(rows);
        };
        script.onerror = () => { cleanup(); reject(new Error('Geblokkeerd of sheet niet openbaar')); };
        let url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=responseHandler:${cbName}`;
        if (sheetName) url += `&sheet=${encodeURIComponent(sheetName)}`;
        script.src = url;
        document.head.appendChild(script);
      });
    }

    async function fetchSheetData(id, importProgress) {
      let parsed = [], errors = [];
      let validNames = new Set();
      try {
        const overviewRows = await fetchSheetJSONP(id, 'Overview');
        overviewRows.forEach(row => row.forEach(cell => {
          const clean = cellStr(cell);
          if (clean && clean.length > 1 && !/^\d+$/.test(clean) && !/^(koi|dragon|common|rare)/i.test(clean)) validNames.add(clean);
        }));
      } catch (e) {}

      for (const sn of DEFAULT_SHEETS) {
        try {
          const rows = await fetchSheetJSONP(id, sn);
          const found = parseGrid(rows, validNames, sn, importProgress);
          if (found.length) parsed = parsed.concat(found);
        } catch (e) { errors.push(e.message); }
      }

      try {
        const progRows = await fetchSheetJSONP(id, 'Progressives');
        const progFound = parseProgressivesGrid(progRows, 'Progressives', importProgress);
        if (progFound.length) parsed = parsed.concat(progFound);
      } catch (e) {}

      if (!parsed.length) {
        throw new Error(errors.filter(Boolean).join(' | ') || 'Geen patronen herkend in de sheet');
      }
      return applyParsed(parsed, importProgress);
    }

    async function syncFromDrive(silent) {
      const driveUrl = document.getElementById('drive-url').value.trim();
      const driveId = sheetId(driveUrl);

      if (!driveId) {
        if (!silent) showStatus('❌ Vul eerst de Google Sheets-link van je voortgang in.', 'err');
        return;
      }

      if (!silent) showStatus('⏳ Voortgang ophalen van Google Sheets…', '');

      try {
        await fetchSheetData(driveId, true);
        settings.driveUrl = driveUrl;
        settings.lastSync = new Date().toISOString();
        saveSettings();

        if (!silent) {
          showStatus('✅ Voortgang succesvol opgehaald met behoud van Dragon-prioriteit!', 'ok');
        }
      } catch (e) {
        if (!silent) showStatus(`❌ Ophalen mislukt: <small>${e.message}</small>`, 'err');
      }
    }

    function saveDriveUrl() {
      settings.driveUrl = document.getElementById('drive-url').value.trim();
      saveSettings();
    }

    function closeModal() { document.getElementById('detail-modal').style.display = 'none'; }
    function openSettings() { document.getElementById('settings-modal').style.display = 'block'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
    function showHome() { closeSettings(); closeModal(); }

    function exportJSON() {
      const backupData = {
        progress: userProgress,
        customPatterns: customPatterns
      };
      const a = document.createElement('a');
      a.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(backupData, null, 2));
      a.download = `zk2_backup_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const content = JSON.parse(e.target.result);

          if (content.progress && typeof content.progress === 'object') {
            userProgress = content.progress;
            if (content.customPatterns && typeof content.customPatterns === 'object') {
              customPatterns = content.customPatterns;
            }
          } else if (typeof content === 'object') {
            userProgress = content;
          } else {
            throw new Error('Ongeldige bestandsstructuur');
          }

          saveUserProgress();
          saveCustomPatterns();
          rebuildPatterns();
          renderPatterns();
          closeSettings();
          alert('✅ Back-up succesvol geïmporteerd!');
        } catch (err) {
          alert('❌ Fout bij het inlezen van het JSON-bestand: ' + err.message);
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function resetAllData() {
      if (confirm('Weet je zeker dat je alle verzamelde vis- en dragongegevens wilt wissen?')) {
        userProgress = {}; saveUserProgress(); renderPatterns(); closeSettings();
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const savedTheme = localStorage.getItem('zk2_theme');
        if (savedTheme === 'light') document.body.classList.add('light-mode');

        userProgress = loadJSON(LS_PROGRESS, {});
        customPatterns = loadJSON(LS_PATTERNS, {});
        settings = loadJSON(LS_SETTINGS, {});

        const driveInput = document.getElementById('drive-url');
        if (driveInput) driveInput.value = settings.driveUrl || '';

        rebuildPatterns();
        renderPatterns();

        const patternId = sheetId(HARDCODED_PATTERN_URL);
        if (patternId) {
          await fetchSheetData(patternId, false);
          rebuildPatterns();
          renderPatterns();
        }

      } catch (e) {
        console.error("Fout bij automatisch inlezen van patronen:", e);
      }
    });
  </script>
</body>
